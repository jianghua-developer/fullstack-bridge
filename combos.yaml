# combos.yaml — 多端组合治理真源（units≥2 + edges；单模板形态不在桥，走能力层 generate_single）
# bases：底座 git 地址注册表（统一 clone 底座用）——source 裸名在此解析 git 地址，一律 clone 到缓存
# units：key = 生成目录名 + project_name 后缀；每项 {source, version}
#   source：系列底座注册裸名（→ bases 注册表 git 地址）——多端只认注册组合（Q4），不支持显式 URL/本地路径
#   version：该组合已复核/对齐到的底座 git 版本（手动维护，非自动更新）——check 以此为基线；生成统一 clone+checkout
# edges：有序对 [consumer, provider]，provider 为契约属主；必填显式，支持多 edge
# 契约目录固定 = combos/<combo>（copier.yml 声明契约参数并集）
# combo 段 selection（可选）：只放**组合不可约**事实（配对/契约治理价值，DESIGN §8）；
#   技术栈选择事实单一真源在各底座 params.json `selection` 区，禁止在此重复写
bases:
  vite-react-spa-template: https://github.com/jianghua-developer/vite-react-spa-template.git
  vite-vue-spa-template:   https://github.com/jianghua-developer/vite-vue-spa-template.git
  python-fastapi-template: https://github.com/jianghua-developer/python-fastapi-template.git
combos:
  python-react:
    units:
      frontend:
        source: vite-react-spa-template
        # 推进到协议 v2（params.json selection 区）——params 区未变，契约基线不受影响
        version: 535f3d2
        # README 元数据：app=职责描述，stack=技术栈（加新组合随 combos.yaml 提供）
        app:   "前端应用"
        stack: "Vite + React + TypeScript + TanStack Query + axios"
      backend:
        source: python-fastapi-template
        version: 3bf48bb
        app:   "后端服务"
        stack: "FastAPI + SQLAlchemy（async）+ pydantic-settings"
    edges: [[frontend, backend]]
    selection:
      suited_for:
        - "前后端分离一体交付：React 前端 + FastAPI 后端同仓，CONTRACT 契约随生成自动对齐"
      tradeoffs:
        - "相对单端分别生成再手工对接：契约/联调前置进生成链（桥治理）；代价是前后端须对齐组合基线版本"
