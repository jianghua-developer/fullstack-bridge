# combos/python-react 契约 copier 模板
# 全必填零默认（决策 ②）：渲染数据由生成链从 answers + 用户参数喂入，无默认值可漂移
_envops:
  undefined: "jinja2.StrictUndefined"

# 复制时排除模板元文件
_exclude:
  - "copier.yml"

# 契约引用的参数（= 本项目参数基线，决策 ③）
project_name:        { type: str }
project_description: { type: str }
api_base_url:        { type: str }
auth_mode:           { type: str }
with_db:             { type: bool }
with_redis:          { type: bool }
with_child_app:      { type: bool }
child_apps_raw:
  type: str
  when: "{{ with_child_app }}"
api_prefix:          { type: str }
