# 项目 README copier 模板（渲染到项目根 README.md）
# 单元展示元数据由 cli.py 从 combos.yaml units.{key}.{app,stack} 装配（units_desc list）
_envops:
  undefined: "jinja2.StrictUndefined"
_exclude:
  - "copier.yml"
project_name:        { type: str }
project_description: { type: str, default: "" }
# 单元列表：[{key, app, stack}]（app=职责描述，stack=技术栈）
units_desc:
  type: yaml
  when: false
