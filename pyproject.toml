[project]
name = "fullstack-bridge"
version = "0.1.0"
description = "前后端连通层：把单端模板与组合契约整合为前后端一体大目录（全 copier 工具链）"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    # copier 走 API（run_copy）——生成核心依赖，打包进单文件的前提
    "copier>=9.17,<10",
]

# 非发布型工具项目：uv sync 只装依赖，不构建/安装本项目
[tool.uv]
package = false

# 开发依赖：uv sync --dev
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pyinstaller>=6.0",  # 打包单文件可执行：uv run pyinstaller integrate.spec
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 根目录入 sys.path（替代根 conftest.py）：bridge/ 与入口脚本可导入
pythonpath = ["."]
